{% set version = "3.3.1" %}
{% set python_min = "3.10" %}

package:
  name: prov
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/prov/prov-{{ version }}.tar.gz
  sha256: b2807fef9ebff3c017dc27537a75029e27c7cfceab68cdc1a2fc8e92a81cb458

build:
  number: 0

# Tests the prov output. conda-build skipped a test block placed inside that output.

test:
  requires:
    - python {{ python_min }}
    - pip
  imports:
    - prov
    - prov.serializers
    - prov.serializers.provrdf
    - prov.serializers.provxml
    - prov.model
    - prov.dot
    - prov.graph
  commands:
    - pip check
    - prov-convert --help
    - prov-compare --help

outputs:
  - name: prov-core
    script: build_prov_core.sh
    build:
      noarch: python
    requirements:
      host:
        - pip
        - python {{ python_min }}
        - setuptools
        - wheel
      run:
        - python >={{ python_min }}
    test:
      requires:
        - python {{ python_min }}
        - pip
      imports:
        - prov
        - prov.serializers
        - prov.model
      commands:
        - pip check
        - prov-convert --help
        - prov-compare --help
    about:
      home: https://github.com/trungdong/prov
      license: MIT
      license_file: LICENSE
      summary: A library for the W3C Provenance Data Model, supporting PROV-JSON, PROV-N and PROV-JSONLD, without the optional rdf/xml/dot/graph extras

  - name: prov
    build:
      noarch: python
    requirements:
      host:
        - python {{ python_min }}
      run:
        - python >={{ python_min }}
        - {{ pin_subpackage('prov-core', exact=True) }}
        - networkx >=2.0
        - pydot >=1.2.0
        - lxml >=3.3.5
        - rdflib >=7.1.1,<8
        - pygments >=2.13

about:
  home: https://github.com/trungdong/prov
  license: MIT
  license_file: LICENSE
  summary: A library for W3C Provenance Data Model supporting PROV-JSON, PROV-XML, PROV-JSONLD and PROV-O (RDF)

extra:
  recipe-maintainers:
    - satra
    - trungdong
